<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Liability Lawsuit Spinner</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <link rel="stylesheet" href="../src/secondary-spinner.css" />
</head>
<body>
  <div class="page-wrap">
    <h1 id="page-title">Liability Lawsuit Spinner</h1>

    <div id="spin_the_wheel">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="spin">SPIN</div>
    </div>

    <div id="result"></div>

    <div class="back-link">
      <a href="/">Back to first spinner</a>
    </div>
  </div>

  <script src="../src/secondary-spinner.js"></script>
  <script>
    createSecondarySpinner({
      title: "Liability Lawsuit Spinner",
      sectors: [
        { color: "#a29bfe", text: "#222222", label: "Slip and fall" },
        { color: "#81ecec", text: "#222222", label: "Dog bite claim" },
        { color: "#fab1a0", text: "#222222", label: "Customer injury" },
        { color: "#ffeaa7", text: "#222222", label: "Property lawsuit" },
        { color: "#55efc4", text: "#222222", label: "Negligence claim" }
      ]
    });
  </script>
</body>
</html>
