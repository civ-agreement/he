<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Property Damage Spinner</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    .page-wrap {
      display: grid;
      place-items: center;
      gap: 18px;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-family: Arial, sans-serif;
      color: #222;
    }

    .back-link, .result-box {
      font-family: Arial, sans-serif;
      color: #222;
    }

    .result-box {
      min-height: 28px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    a {
      color: #0b57d0;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1>Property Damage Spinner</h1>

    <div id="spin_the_wheel">
      <canvas id="wheel" width="500" height="500"></canvas>
      <div id="spin">SPIN</div>
    </div>

    <div id="result" class="result-box"></div>
    <div class="back-link"><a href="/he/">Back to first spinner</a></div>
  </div>

  <script>
    const sectors = [
    { color: "#55efc4", text: "#222222", label: "Broken window" },
    { color: "#74b9ff", text: "#222222", label: "Roof damage" },
    { color: "#ff7675", text: "#222222", label: "Water leak" },
    { color: "#ffeaa7", text: "#222222", label: "Electrical damage" },
    { color: "#fd79a8", text: "#222222", label: "Theft loss" }
];

    buildSpinner(sectors);

    function buildSpinner(sectors) {
      const events = {
        listeners: {},
        addListener(eventName, fn) {
          this.listeners[eventName] = this.listeners[eventName] || [];
          this.listeners[eventName].push(fn);
        },
        fire(eventName, ...args) {
          if (this.listeners[eventName]) {
            for (const fn of this.listeners[eventName]) {
              fn(...args);
            }
          }
        },
      };

      const rand = (m, M) => Math.random() * (M - m) + m;
      const tot = sectors.length;
      const spinEl = document.querySelector("#spin");
      const resultEl = document.querySelector("#result");
      const ctx = document.querySelector("#wheel").getContext("2d");

      const dia = ctx.canvas.width;
      const rad = dia / 2;
      const PI = Math.PI;
      const TAU = 2 * PI;
      const arc = TAU / sectors.length;
      const friction = 0.991;

      let angVel = 0;
      let ang = 0;
      let spinButtonClicked = false;

      const getIndex = () => Math.floor(tot - (ang / TAU) * tot) % tot;

      function drawSector(sector, i) {
        const ang = arc * i;
        ctx.save();

        ctx.beginPath();
        ctx.fillStyle = sector.color;
        ctx.moveTo(rad, rad);
        ctx.arc(rad, rad, rad, ang, ang + arc);
        ctx.lineTo(rad, rad);
        ctx.fill();

        ctx.translate(rad, rad);
        ctx.rotate(ang + arc / 2);
        ctx.textAlign = "right";
        ctx.fillStyle = sector.text;
        ctx.font = "bold 22px Arial, sans-serif";
        ctx.fillText(sector.label, rad - 10, 10);

        ctx.restore();
      }

      function rotate() {
        const sector = sectors[getIndex()];
        ctx.canvas.style.transform = `rotate(${ang - PI / 2}rad)`;
        spinEl.textContent = !angVel ? "SPIN" : sector.label;
        spinEl.style.background = sector.color;
        spinEl.style.color = sector.text;
      }

      function frame() {
        if (!angVel && spinButtonClicked) {
          const finalSector = sectors[getIndex()];
          events.fire("spinEnd", finalSector);
          spinButtonClicked = false;
          return;
        }

        angVel *= friction;
        if (angVel < 0.002) angVel = 0;

        ang += angVel;
        ang %= TAU;

        rotate();
      }

      function engine() {
        frame();
        requestAnimationFrame(engine);
      }

      function init() {
        sectors.forEach(drawSector);
        rotate();
        engine();

        spinEl.addEventListener("click", () => {
          if (!angVel) {
            angVel = rand(0.25, 0.45);
            resultEl.textContent = "";
            spinButtonClicked = true;
          }
        });
      }

      init();

      events.addListener("spinEnd", (sector) => {
        resultEl.textContent = `Result: ${sector.label}`;
      });
    }
  </script>
</body>
</html>
