<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Disaster Event Spinner</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <link rel="stylesheet" href="../src/secondary-spinner.css" />
</head>
<body>
  <div class="page-wrap">
    <h1 id="page-title">Disaster Event Spinner</h1>

    <div id="spin_the_wheel">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="spin">SPIN</div>
    </div>

    <div id="result"></div>

    <div class="back-link">
      <a href="/">Back to first spinner</a>
    </div>
  </div>

  <script src="../src/secondary-spinner.js"></script>
  <script>
    createSecondarySpinner({
      title: "Disaster Event Spinner",
      sectors: [
        { color: "#ff7675", text: "#222222", label: "House fire" },
        { color: "#74b9ff", text: "#222222", label: "Flood damage" },
        { color: "#ffeaa7", text: "#222222", label: "Storm damage" },
        { color: "#55efc4", text: "#222222", label: "Wildfire" },
        { color: "#fd79a8", text: "#222222", label: "Earthquake" }
      ]
    });
  </script>
</body>
</html>
