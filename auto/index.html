<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto Accident Spinner</title>
  <link rel="stylesheet" href="../src/secondary-spinner.css" />
</head>
<body>
  <div class="page-wrap">
    <h1 id="page-title">Auto Accident Spinner</h1>

    <div id="spin_the_wheel">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="spin"><span>SPIN</span></div>
    </div>

    <div id="result"></div>

    <div class="back-link">
      <a href="/">Back to first spinner</a>
    </div>
  </div>

  <script src="../src/secondary-spinner.js"></script>
  <script>
    createSecondarySpinner({
      title: "Auto Accident Spinner",
      sectors: [
        { color: "#a29bfe", text: "#222222", label: "Fender bender" },
        { color: "#81ecec", text: "#222222", label: "Major crash" },
        { color: "#fab1a0", text: "#222222", label: "Hit and run" },
        { color: "#ffeaa7", text: "#222222", label: "Windshield damage" },
        { color: "#55efc4", text: "#222222", label: "Parking lot accident" }
      ]
    });
  </script>
</body>
</html>
