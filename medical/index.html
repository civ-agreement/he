<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medical Emergency Spinner</title>
  <link rel="stylesheet" href="../src/styles.css" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #1f2937;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .page-wrap {
      width: 100%;
      max-width: 900px;
      min-height: 100vh;
      box-sizing: border-box;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px 40px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      line-height: 1.2;
    }

    #spin_the_wheel {
      position: relative;
      width: min(90vw, 560px);
      height: min(90vw, 560px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #wheel {
      width: 100%;
      height: 100%;
      display: block;
    }

    #spin {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 110px;
      height: 110px;
      border-radius: 999px;
      border: none;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 1rem;
      background: white;
      color: #111827;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
      cursor: pointer;
      user-select: none;
      z-index: 2;
      text-align: center;
      padding: 8px;
    }

    #result {
      min-height: 32px;
      font-size: 1.1rem;
      font-weight: 700;
      line-height: 1.4;
      padding: 0 12px;
    }

    .back-link {
      font-size: 1rem;
      line-height: 1.4;
    }

    .back-link a {
      color: #0b57d0;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="page-wrap">
    <h1>Medical Emergency Spinner</h1>

    <div id="spin_the_wheel">
      <canvas id="wheel" width="560" height="560"></canvas>
      <div id="spin">SPIN</div>
    </div>

    <div id="result"></div>
    <div class="back-link">
      <a href="/">Back to first spinner</a>
    </div>
  </div>

  <script>
    const sectors = [
      { color: "#ff7675", text: "#222222", label: "ER visit" },
      { color: "#74b9ff", text: "#222222", label: "Ambulance ride" },
      { color: "#55efc4", text: "#222222", label: "Broken arm" },
      { color: "#ffeaa7", text: "#222222", label: "Surgery" },
      { color: "#fd79a8", text: "#222222", label: "Hospital stay" }
    ];

    const events = {
      listeners: {},
      addListener(eventName, fn) {
        this.listeners[eventName] = this.listeners[eventName] || [];
        this.listeners[eventName].push(fn);
      },
      fire(eventName, ...args) {
        if (this.listeners[eventName]) {
          for (const fn of this.listeners[eventName]) {
            fn(...args);
          }
        }
      }
    };

    const rand = (m, M) => Math.random() * (M - m) + m;
    const tot = sectors.length;
    const spinEl = document.querySelector("#spin");
    const resultEl = document.querySelector("#result");
    const ctx = document.querySelector("#wheel").getContext("2d");

    const dia = ctx.canvas.width;
    const rad = dia / 2;
    const PI = Math.PI;
    const TAU = 2 * PI;
    const arc = TAU / sectors.length;
    const friction = 0.991;

    let angVel = 0;
    let ang = 0;
    let spinButtonClicked = false;

    const getIndex = () => Math.floor(tot - (ang / TAU) * tot) % tot;

    function wrapText(ctx, text, maxWidth) {
      const words = text.split(" ");
      const lines = [];
      let currentLine = words[0] || "";

      for (let i = 1; i < words.length; i++) {
        const testLine = currentLine + " " + words[i];
        const testWidth = ctx.measureText(testLine).width;

        if (testWidth <= maxWidth) {
          currentLine = testLine;
        } else {
          lines.push(currentLine);
          currentLine = words[i];
        }
      }

      lines.push(currentLine);
      return lines;
    }

    function drawSector(sector, i) {
      const ang = arc * i;
      const maxWidth = rad * 0.6;
      const lineHeight = 22;
      const fontSize = 18;
      const textX = rad * 0.63;

      ctx.save();

      ctx.beginPath();
      ctx.fillStyle = sector.color;
      ctx.moveTo(rad, rad);
      ctx.arc(rad, rad, rad, ang, ang + arc);
      ctx.lineTo(rad, rad);
      ctx.fill();

      ctx.translate(rad, rad);
      ctx.rotate(ang + arc / 2);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = sector.text;
      ctx.font = `bold ${fontSize}px Arial, sans-serif`;

      const lines = wrapText(ctx, sector.label, maxWidth);
      const startY = -((lines.length - 1) * lineHeight) / 2;

      lines.forEach((line, index) => {
        ctx.fillText(line, textX, startY + index * lineHeight);
      });

      ctx.restore();
    }

    function rotate() {
      const sector = sectors[getIndex()];
      ctx.canvas.style.transform = `rotate(${ang - PI / 2}rad)`;
      spinEl.textContent = !angVel ? "SPIN" : sector.label;
      spinEl.style.background = sector.color;
      spinEl.style.color = sector.text;
    }

    function frame() {
      if (!angVel && spinButtonClicked) {
        const finalSector = sectors[getIndex()];
        events.fire("spinEnd", finalSector);
        spinButtonClicked = false;
        return;
      }

      angVel *= friction;
      if (angVel < 0.002) angVel = 0;

      ang += angVel;
      ang %= TAU;

      rotate();
    }

    function engine() {
      frame();
      requestAnimationFrame(engine);
    }

    function init() {
      sectors.forEach(drawSector);
      rotate();
      engine();

      spinEl.addEventListener("click", () => {
        if (!angVel) {
          angVel = rand(0.25, 0.45);
          resultEl.textContent = "";
          spinButtonClicked = true;
        }
      });
    }

    init();

    events.addListener("spinEnd", (sector) => {
      resultEl.textContent = `Result: ${sector.label}`;
    });
  </script>
</body>
</html>
